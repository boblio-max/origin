name: build-installers

# Build standalone Origin installers for Windows, macOS, and Linux on
# every push to main and every published tag. PyInstaller cannot
# cross-compile, so each platform is built on a native runner.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            spec: origin.spec
            binary: origin.exe
            archive: OriginInstaller-windows-x64.zip
            sha_tool: powershell
          - os: macos-latest
            label: macos-universal
            spec: origin.spec.macos
            binary: origin
            archive: OriginInstaller-macos-universal.zip
            sha_tool: shasum
          - os: ubuntu-latest
            label: linux-x64
            spec: origin.spec.linux
            binary: origin
            archive: OriginInstaller-linux-x64.zip
            sha_tool: sha256sum

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install PyInstaller (skip RPi.GPIO on non-Pi hosts)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          # adafruit-circuitpython-servokit installs cleanly on all OSes.
          python -m pip install adafruit-circuitpython-servokit || true
          # RPi.GPIO is Linux/arm only. CI is x86_64; try anyway and ignore.
          python -m pip install RPi.GPIO || echo "RPi.GPIO not available on ${{ runner.os }} - expected on non-Pi runners."

      - name: Build with PyInstaller
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --clean "${{ matrix.spec }}"

      - name: Stage installer bundle
        shell: bash
        run: |
          set -euo pipefail
          STAGE="stage"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"
          cp "dist/${{ matrix.binary }}" "${STAGE}/${{ matrix.binary }}"
          if [[ -d dist/_internal ]] || [[ -d dist/lib ]]; then
            cp -R dist/lib "${STAGE}/lib" 2>/dev/null || true
            cp -R dist/_internal "${STAGE}/_internal" 2>/dev/null || true
          fi
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp secure_install.ps1 "${STAGE}/secure_install.ps1"
          else
            cp secure_install.sh "${STAGE}/secure_install.sh"
            chmod +x "${STAGE}/secure_install.sh"
          fi
          # Generate per-binary SHA256SUMS so secure_install.{sh,ps1} can verify.
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BIN_HASH=$(powershell -NoProfile -Command "(Get-FileHash -Path '${STAGE}/${{ matrix.binary }}' -Algorithm SHA256).Hash.ToLower()")
            printf '%s  %s\n' "${BIN_HASH}" "${{ matrix.binary }}" > "${STAGE}/SHA256SUMS"
          else
            ( cd "${STAGE}" && sha256sum "${{ matrix.binary }}" > SHA256SUMS )
          fi

      - name: Zip bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'stage/*' -DestinationPath '${{ matrix.archive }}' -Force"
          else
            ( cd stage && zip -r "../${{ matrix.archive }}" . )
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Attach installers to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
          generate_release_notes: true
